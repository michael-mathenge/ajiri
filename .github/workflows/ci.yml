# Continuous Integration: every push to main and every pull request gets the same checks
# you run by hand. Application gates retain their original required-check names:
#   backend  - manage.py check, missing-migration check and the tests, on the Python you
#              deploy with (3.12), plus supported Python 3.13 and 3.14.
#   frontend - lint, a production build, and a check that the committed
#              ajiri-backend/frontend_build/ really is what that build produces.
#   browser/quality - isolated real-browser journey and developer-quality reports.
# See docs/CONCEPTS.md#github-actions
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DEBUG: 'True'
      SECRET_KEY: ci-quality-only-not-a-real-secret
      PYTHON_DOTENV_DISABLED: '1'
      REAL_EMAIL_ENABLED: 'False'
      COVERAGE_FILE: ${{ github.workspace }}/.verification/quality/.coverage
      QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ajiri-backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: ajiri-frontend/package-lock.json
      - run: python -m pip install -r ajiri-backend/requirements-quality.txt
      - run: npm --prefix ajiri-frontend ci
      - run: python -m ruff check --no-cache ajiri-backend scripts
      - run: python -m pre_commit validate-config
      - run: python -m pre_commit run --from-ref "$QUALITY_BASE" --to-ref HEAD
      - run: npm --prefix ajiri-frontend run lint:eslint
      - run: npm --prefix ajiri-frontend run test:quality
      - run: python -m unittest discover -s scripts/tests
      - name: Full-suite coverage
        working-directory: ajiri-backend
        run: |
          mkdir -p ../.verification/quality
          python -m coverage run --rcfile=../.coveragerc manage.py test --noinput
          python -m coverage report --rcfile=../.coveragerc | tee ../.verification/quality/coverage.txt
          python -m coverage xml --rcfile=../.coveragerc
      - name: Nonblocking legacy type findings (execution failures still fail)
        run: python scripts/type_baseline.py
      - name: Retain source-only quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          retention-days: 7
          if-no-files-found: warn
          path: |
            .verification/quality/coverage.xml
            .verification/quality/coverage.txt
            .verification/quality/mypy.txt
            .verification/quality/mypy-summary.json

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ajiri-backend
    env:
      DEBUG: 'True'
      SECRET_KEY: ci-browser-only-not-a-real-secret
      PYTHON_DOTENV_DISABLED: '1'
      REAL_EMAIL_ENABLED: 'False'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ajiri-backend/requirements*.txt
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python manage.py test browser_tests.journey --noinput

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    defaults:
      run:
        working-directory: ajiri-backend
    env:
      # settings.py refuses to start without these (see .env.example).
      DEBUG: 'True'
      SECRET_KEY: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ajiri-backend/requirements*.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ajiri-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ajiri-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
      - name: frontend_build matches the source
        run: |
          if diff -r dist ../ajiri-backend/frontend_build; then
            echo "frontend_build is in sync with the frontend source"
          else
            echo "::error::frontend_build is out of date. Run ajiri-backend/scripts/build_frontend.ps1 and commit the result."
            exit 1
          fi
