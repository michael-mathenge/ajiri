# Fetches the MyJobMag feed from GitHub's servers (which have open internet) and
# POSTs it to Ajiri. Needed because PythonAnywhere's free tier can only reach
# whitelisted sites, so the server can't fetch the feed itself.
# See docs/CONCEPTS.md#remote-ingestion
#
# Scheduled workflows only run from the DEFAULT branch (main), so this file does
# nothing until it is merged there. Run it by hand any time from the Actions tab.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   AJIRI_BASE_URL   e.g. https://yourname.pythonanywhere.com   (no trailing slash)
#   INGEST_API_KEY   must equal INGEST_API_KEY in the server's .env
name: Ingest jobs

permissions:
  contents: read

on:
  schedule:
    # Every 3 hours, at minute 17. Not on the hour: GitHub queues heavily at :00
    # and may delay or drop runs. Every 3 hours (not hourly) also saves
    # PythonAnywhere's small daily CPU allowance.
    - cron: '17 */3 * * *'
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FEED_URL: https://www.myjobmag.co.ke/jobsxml_by_categories.xml
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the feed
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --retry-max-time 120 --max-time 60 \
            --user-agent "Mozilla/5.0 (compatible; AjiriIngest/1.0)" \
            --output feed.xml "$FEED_URL"
          # An empty file would be a silent success otherwise.
          test -s feed.xml
          echo "Downloaded $(wc -c < feed.xml) bytes"

      - name: Check delivery helper
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_post_feed.py'

      - name: Check readiness and send the feed once
        env:
          AJIRI_BASE_URL: ${{ secrets.AJIRI_BASE_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
        run: |
          # Readiness GETs may retry; POST outcomes can include partial side effects.
          # Never log raw bodies or automatically replay an uncertain POST.
          python3 -B .github/scripts/post_feed.py
