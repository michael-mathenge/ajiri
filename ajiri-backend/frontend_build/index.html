      content="Find jobs in Kenya that match your skills. Review your applications and take the next step with Ajiri."
    />
    <script>
      // Apply before paint to avoid flashing the wrong theme. See docs/CONCEPTS.md#design-tokens
      try {
        const saved = localStorage.getItem('ajiri-theme')
        document.documentElement.dataset.theme =
          saved === 'dark' || saved === 'light'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
