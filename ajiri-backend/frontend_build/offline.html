<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0f231d" />
    <title>Ajiri - Offline</title>
    <style>
      body {
        margin: 0;
        background: #0f231d;
        color: #effaf6;
        font:
          1rem/1.6 system-ui,
          sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 30rem;
        padding: 2rem;
      }
      h1 {
        line-height: 1.2;
      }
      a {
        color: #8cddc0;
        text-underline-offset: 0.2em;
      }
      a:focus-visible {
        outline: 3px solid #8cddc0;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>AJIRI KENYA</p>
      <h1>You're offline</h1>
      <p>Reconnect to browse jobs, review your documents or save changes.</p>
      <p>
        This offline page does not show account information or submit requests.
        If a request was interrupted, check its status after reconnecting before
        trying again.
      </p>
      <a href="/login">Try Ajiri again</a>
    </main>
  </body>
</html>
