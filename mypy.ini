[mypy]
python_version = 3.12
files = ajiri-backend/accounts,ajiri-backend/config,ajiri-backend/jobs,ajiri-backend/profiles
exclude = (^|/)(migrations|test[^/]*\.py)(/|$)
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = True
show_error_codes = True
pretty = False
cache_dir = .verification/mypy-cache
